name: Deploy demo to GitHub Pages

# Builds the frontend with mock data instead of a real backend (see
# src/lib/mockApi.js) and publishes it to GitHub Pages. Runs on every push
# to main that touches the frontend, and can also be triggered manually
# from the Actions tab.
#
# One-time setup required: repo Settings > Pages > Source > "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (demo mode)
        env:
          VITE_DEMO_MODE: "true"
          VITE_REPO_NAME: ${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
