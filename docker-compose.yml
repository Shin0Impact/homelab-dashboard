version: '3.8'

services:
  homelab-dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      # Mount host Docker socket read-only to monitor running containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production